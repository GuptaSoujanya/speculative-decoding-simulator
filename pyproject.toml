[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-simulator"
version = "0.2.4"
description = "Mathematical simulator for speculative decoding acceptance rates and latency speedup factors."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "158287001+GuptaSoujanya@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
spec-sim = "spec_sim.cli:main"
